name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -Xlint:unchecked -d out $(find src -name '*.java')
      - name: Smoke test (mở rồi thoát chương trình)
        run: echo "0" | java -cp out hotel.Main
